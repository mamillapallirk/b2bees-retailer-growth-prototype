<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2Bees Retailer Growth</title>
<meta name="description" content="Clickable prototype of the B2Bees retailer onboarding and supplier-discovery experience. Mock data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head><body>
<style>
/* Layout: B2Bees "growth" shell — white top bar over a cool blue-lavender ground,
   narrow centered column for onboarding steps, wide two-column app for discovery.
   Tokens are copied from the live B2Bees portal (--g-* in /portal/assets/index-*.css). */
:root {
  --bg: #E8EFF7;
  --bg-glow: #DCE3F6;
  --surface: #ffffff;
  --surface-2: #F3F7FC;
  --surface-3: #DBE4EF;
  --border: #D8E1EE;
  --ink: #0E1623;
  --ink-soft: #506787;
  --ink-faint: #717B8D;
  --accent: #394CE8;
  --accent-ink: #2D36D3;
  --accent-soft: #E2E8FF;
  --accent-glow: rgba(57, 76, 232, .16);
  --on-accent: #ffffff;
  --gold: #DF911A;
  --gold-ink: #9A6418;
  --gold-soft: #FFEACF;
  --success: #008858;
  --success-soft: #D8F7E6;
  --danger: #C82D42;
  --danger-soft: #FFE6E5;
  --progress: #854ECE;
  --progress-soft: #F2E9FF;
  --expansion: #008D94;
  --expansion-soft: #D8F5F6;
  --map-water: #CFE3F3;
  --map-land: #F4F7FB;
  --map-line: #B9C7DA;
  --shadow: 0 1px 2px rgba(14, 22, 35, .04), 0 8px 20px -12px rgba(14, 22, 35, .18);
  --shadow-lg: 0 2px 6px rgba(14, 22, 35, .07), 0 28px 56px -20px rgba(14, 22, 35, .28);
  --scrim: rgba(14, 22, 35, .38);

  --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --radius: 14px;
  --radius-lg: 20px;
  --wrap: 1160px;
  --notes-w: 380px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1420; --bg-glow: #131B33; --surface: #141C2B; --surface-2: #1B2434; --surface-3: #273143;
    --border: #2B3648; --ink: #E2E8F2; --ink-soft: #9AA5B8; --ink-faint: #91A0B5;
    --accent: #819EFF; --accent-ink: #A0BAFF; --accent-soft: #1F285A; --accent-glow: rgba(129, 158, 255, .16); --on-accent: #0D1420;
    --gold: #F2A53F; --gold-ink: #F7C97F; --gold-soft: #3A2A10;
    --success: #4ECB92; --success-soft: #0F2A1F; --danger: #FF7A85; --danger-soft: #3A1D20;
    --progress: #AE84F2; --progress-soft: #241A3A; --expansion: #48B7BD; --expansion-soft: #10303A;
    --map-water: #12233A; --map-land: #1B2434; --map-line: #34425A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .55);
    --shadow-lg: 0 4px 10px rgba(0, 0, 0, .45), 0 28px 56px -20px rgba(0, 0, 0, .65);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1420; --bg-glow: #131B33; --surface: #141C2B; --surface-2: #1B2434; --surface-3: #273143;
  --border: #2B3648; --ink: #E2E8F2; --ink-soft: #9AA5B8; --ink-faint: #91A0B5;
  --accent: #819EFF; --accent-ink: #A0BAFF; --accent-soft: #1F285A; --accent-glow: rgba(129, 158, 255, .16); --on-accent: #0D1420;
  --gold: #F2A53F; --gold-ink: #F7C97F; --gold-soft: #3A2A10;
  --success: #4ECB92; --success-soft: #0F2A1F; --danger: #FF7A85; --danger-soft: #3A1D20;
  --progress: #AE84F2; --progress-soft: #241A3A; --expansion: #48B7BD; --expansion-soft: #10303A;
  --map-water: #12233A; --map-land: #1B2434; --map-line: #34425A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -12px rgba(0, 0, 0, .55);
  --shadow-lg: 0 4px 10px rgba(0, 0, 0, .45), 0 28px 56px -20px rgba(0, 0, 0, .65);
  --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.55; color: var(--ink);
  background: var(--bg);
  background-image: linear-gradient(170deg, var(--bg-glow) 0%, var(--bg) 420px);
  background-repeat: no-repeat;
  min-height: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 3px solid var(--accent-glow); outline-offset: 2px; box-shadow: 0 0 0 1.5px var(--accent); border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

/* ---------- type ---------- */
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -.015em; line-height: 1.08; font-size: clamp(2rem, 4.4vw, 3.4rem); }
.h1 { font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em; line-height: 1.12; font-size: clamp(1.75rem, 3.2vw, 2.5rem); }
.h2 { font-family: var(--font-display); font-weight: 700; line-height: 1.2; font-size: clamp(1.3rem, 2.2vw, 1.6rem); }
.h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.25; font-size: 1.22rem; }
.lede { font-size: 1.12rem; color: var(--ink-soft); max-width: 62ch; }
.muted { color: var(--ink-soft); }
.faint { color: var(--ink-faint); font-size: .9rem; }
.eyebrow { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }

/* ---------- shell ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--border); }
.topbar-in { max-width: var(--wrap); margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 20px; }
.logo { display: inline-flex; flex-direction: column; text-decoration: none; color: var(--ink); cursor: pointer; line-height: 1; flex: none; }
.logo-word { font-family: var(--font-body); font-weight: 800; font-size: 1.55rem; letter-spacing: -.02em; }
.logo-word b { color: var(--accent); font-weight: 800; }
.logo-sub { font-size: .52rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); margin-top: 3px; }
.mainnav { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
.navlink { border: 0; background: none; padding: 8px 12px; border-radius: 999px; color: var(--ink-soft); font-weight: 600; font-size: .95rem; cursor: pointer; white-space: nowrap; text-decoration: none; }
.navlink:hover { color: var(--ink); background: var(--surface-2); }
.navlink.on { color: var(--accent-ink); background: var(--accent-soft); }
.nav-dd { position: relative; }
.nav-dd summary { list-style: none; }
.nav-dd summary::-webkit-details-marker { display: none; }
.nav-dd summary::after { content: ""; display: inline-block; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); margin-left: 8px; }
.dd-menu { position: absolute; top: calc(100% + 8px); left: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 6px; min-width: 240px; display: grid; gap: 2px; z-index: 40; }
.dd-menu button { text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; display: grid; gap: 1px; }
.dd-menu button:hover { background: var(--surface-2); }
.dd-menu button b { font-weight: 600; }
.dd-menu button span { font-size: .84rem; color: var(--ink-soft); }
.nav-flat { display: none; }
.top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }
.store-pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border: 1px solid var(--border); border-radius: 999px; font-weight: 600; font-size: .9rem; background: var(--surface); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; font-weight: 700; font-size: .8rem; }
.notes-toggle { border: 1px dashed var(--border); background: var(--surface-2); color: var(--ink-soft); font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; padding: 7px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.notes-toggle[aria-pressed="true"] { border-style: solid; border-color: var(--progress); color: var(--progress); background: var(--progress-soft); }

main#app { padding-block: 0 96px; }
body.notes-open main#app, body.notes-open .topbar-in { transition: padding .2s; }
@media (min-width: 1280px) { body.notes-open main#app { padding-right: var(--notes-w); } }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: 16px; }
.wrap-narrow { max-width: 820px; margin: 0 auto; padding-inline: 16px; }
.page-head { padding-block: 32px 20px; display: grid; gap: 12px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 22px; font-weight: 600; font-size: 1rem; border: 1px solid transparent; cursor: pointer; text-decoration: none; line-height: 1.2; white-space: nowrap; transition: transform .12s, box-shadow .12s, background .12s; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px -6px var(--accent-glow), 0 2px 6px var(--accent-glow); }
.btn-primary:hover { background: var(--accent-ink); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; color: var(--accent-ink); padding-inline: 10px; }
.btn-ghost:hover { background: var(--accent-soft); }
.btn-lg { padding: 15px 30px; font-size: 1.08rem; }
.btn-sm { padding: 7px 14px; font-size: .9rem; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; box-shadow: none; }
.btn-done { background: var(--success-soft); color: var(--success); border-color: transparent; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: none; }
.link:hover { text-decoration: underline; }
.backlink { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font-weight: 600; border: 0; background: none; padding: 0; cursor: pointer; font-size: 1rem; }
.backlink:hover { color: var(--ink); }
.backlink::before { content: "\2190"; font-size: 1.1rem; }

/* ---------- cards, chips, badges ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
.card-pad { padding: 28px; }
.card-pad-sm { padding: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-soft); font-weight: 600; font-size: .92rem; cursor: default; white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--accent-ink); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.chip.on::before { content: "\2713"; font-size: .85em; }
.chip.nocheck::before { content: none; }
.chip .x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 4px; font-size: 1.05rem; line-height: 1; }
.chip .count { font-family: var(--font-mono); font-size: .76rem; background: var(--surface); border-radius: 999px; padding: 1px 7px; color: var(--accent-ink); }
.chip-add { border-style: dashed; background: transparent; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; background: var(--surface-2); color: var(--ink-soft); white-space: nowrap; }
.badge.ok { background: var(--success-soft); color: var(--success); }
.badge.ship { background: var(--expansion-soft); color: var(--expansion); }
.badge.gold { background: var(--gold-soft); color: var(--gold-ink); }
.badge.prog { background: var(--progress-soft); color: var(--progress); }
.badge.acc { background: var(--accent-soft); color: var(--accent-ink); }
.badge.warn { background: var(--danger-soft); color: var(--danger); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.label { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; display: block; margin-bottom: 12px; }
.divider { height: 1px; background: var(--border); border: 0; margin: 0; }

/* ---------- stepper ---------- */
.stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; color: var(--ink-faint); font-size: .95rem; }
.step { display: inline-flex; align-items: center; gap: 8px; }
.step i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; background: var(--surface-3); color: var(--ink-soft); font-family: var(--font-mono); }
.step.now { color: var(--ink); }
.step.now i { background: var(--accent); color: var(--on-accent); }
.step.done i { background: var(--accent); color: var(--on-accent); }
.step.done i::before { content: "\2713"; }
.step-line { width: 28px; height: 2px; background: var(--surface-3); border-radius: 2px; }
.step-line.done { background: var(--accent); }
@media (max-width: 560px) { .step:not(.now) span { display: none; } .step-line { width: 16px; } }

/* ---------- forms ---------- */
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: .92rem; }
.input, .select, textarea.input { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 13px 16px; font-size: 1rem; color: var(--ink); }
.input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
.input.err { border-color: var(--danger); }
.err-msg { color: var(--danger); font-size: .86rem; font-weight: 600; }
.input-lg { padding: 17px 20px; font-size: 1.1rem; border-radius: 16px; }
.searchbar { display: flex; gap: 10px; align-items: stretch; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 6px 6px 22px; box-shadow: var(--shadow); }
.searchbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
.searchbar input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 1.08rem; padding: 10px 0; }
.searchbar input:focus { outline: none; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 0; font-size: .95rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.check .n { margin-left: auto; color: var(--ink-faint); font-family: var(--font-mono); font-size: .78rem; }

/* ---------- landing ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 48px; align-items: start; padding-block: 56px 40px; }
.hero-main { display: grid; gap: 22px; align-content: start; }
.hero-main .searchbar { margin-top: 8px; }
.hero-steps { display: grid; gap: 22px; position: relative; }
.hero-step { display: grid; grid-template-columns: 34px 1fr; gap: 16px; position: relative; }
.hero-step i { font-style: normal; width: 34px; height: 34px; border-radius: 50%; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; font-weight: 700; z-index: 1; }
.hero-step:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 36px; bottom: -22px; width: 2px; background: var(--border); }
.hero-step b { display: block; font-size: 1.04rem; }
.hero-step p { color: var(--ink-soft); font-size: .95rem; }
.try { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-faint); font-size: .92rem; }
.pulse-strip { display: flex; flex-wrap: wrap; gap: 10px 28px; padding-block: 22px; border-top: 1px solid var(--border); color: var(--ink-soft); font-size: .95rem; }
.pulse-strip b { color: var(--ink); font-family: var(--font-display); font-size: 1.2rem; margin-right: 4px; }
@media (max-width: 880px) { .hero { grid-template-columns: 1fr; gap: 28px; padding-block: 32px 24px; } }

/* ---------- business search ---------- */
.biz-list { display: grid; gap: 10px; }
.biz { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.biz:hover { border-color: var(--accent); }
.biz-ico { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; }
.biz h3 { font-size: 1.05rem; font-weight: 700; font-family: var(--font-body); }
.biz .addr { color: var(--ink-soft); font-size: .93rem; }
.biz mark { background: var(--gold-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
@media (max-width: 600px) { .biz { grid-template-columns: 36px minmax(0, 1fr); } .biz .btn { grid-column: 1 / -1; } .biz-ico { width: 36px; height: 36px; } }
.skel { height: 78px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.1s infinite linear; border: 1px solid var(--border); }
@keyframes shimmer { to { background-position: -200% 0; } }
.state-box { text-align: center; padding: 36px 24px; display: grid; gap: 10px; justify-items: center; }
.state-box .ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-soft); }
.state-box.error .ico { background: var(--danger-soft); color: var(--danger); }

/* ---------- processing ---------- */
.proc { display: grid; gap: 26px; justify-items: center; padding: 40px 28px; text-align: center; }
.comb { width: 168px; height: 112px; }
.comb polygon { fill: var(--surface-2); stroke: var(--border); stroke-width: 1.5; transition: fill .5s; }
.comb polygon.lit { fill: var(--gold-soft); }
.comb polygon.hot { fill: var(--gold); }
.proc-steps { display: grid; gap: 12px; text-align: left; width: min(420px, 100%); }
.pstep { display: flex; gap: 12px; align-items: center; color: var(--ink-faint); font-weight: 500; }
.pstep .ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface-3); flex: none; display: grid; place-items: center; font-size: .7rem; }
.pstep.now { color: var(--ink); font-weight: 600; }
.pstep.now .ic { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 35%, transparent 40%); }
.pstep.done { color: var(--ink-soft); }
.pstep.done .ic { border-color: var(--success); color: var(--success); }
.pstep.done .ic::before { content: "\2713"; font-weight: 700; }
.pbar { width: min(420px, 100%); height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--accent), var(--gold)); transition: width .5s ease; }

/* ---------- profile ---------- */
.store-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.store-mark { width: 64px; height: 64px; border-radius: 18px; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; }
.store-name { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.8rem, 3.4vw, 2.6rem); letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; }
.kv { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px 24px; padding-block: 20px; border-top: 1px solid var(--border); align-items: start; }
.kv:first-of-type { border-top: 0; }
.kv dt { font-family: var(--font-mono); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); padding-top: 6px; }
.kv dd { margin: 0; min-width: 0; }
.kv dd.big { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
@media (max-width: 640px) { .kv { grid-template-columns: 1fr; gap: 8px; } }

/* ---------------------------------------------------------------- matching */
function buildProfile(place, tplKey) {
  const t = PROFILE_TEMPLATES[tplKey || place.profile];
  return { ...place, type: t.type, markets: t.markets.slice(), categories: t.categories.slice(), conf: { ...t.conf }, signals: t.signals.slice(), edited: false };
}
function territory(s, p = S.profile) {
  if (!p) return { level: 'unknown' };
  const t = s.serves[p.st];
  if (!t) return { level: 'none' };
  if (t.counties && !t.counties.includes(p.county)) return { level: 'outside', ...t };
  return { level: t.mode, ...t };
}
function supplierHasProductType(s, pt) {
  return PRODUCTS.some(p => p.s.includes(s.id) && pt.kw.some(k => p.name.toLowerCase().includes(k)));
}
function intentHit(s, i) {
  if (i.kind === 'brand') return s.brands.includes(i.label);
  if (i.kind === 'category') return s.cats.includes(i.label);
  if (i.kind === 'product') { const pt = PTYPES.find(x => x.name === i.label); return pt ? supplierHasProductType(s, pt) : false; }
  const k = i.label.toLowerCase();
  return PRODUCTS.some(p => p.s.includes(s.id) && p.name.toLowerCase().includes(k)) || s.brands.some(b => b.toLowerCase() === k);
}
/* Explainable fit: every point maps to a named, data-backed component. */
function fit(s) {
  const p = S.profile;
  if (!p) return null;
  const terr = territory(s);
  const catHit = s.cats.filter(c => p.categories.includes(c));
  const mkHit = s.markets.filter(m => p.markets.includes(m));
  const intentHits = S.intents.filter(i => intentHit(s, i));
  const hasIntent = S.intents.length > 0;
  const W = hasIntent ? { cat: 33, mk: 13, int: 20, terr: 24, net: 10 } : { cat: 43, mk: 19, int: 0, terr: 26, net: 12 };
  const catS = p.categories.length ? Math.min(1, catHit.length / Math.min(p.categories.length, 6)) : 0;
  const mkS = p.markets.length ? Math.min(1, mkHit.length / Math.min(p.markets.length, 3)) : 0;
  const intS = hasIntent ? intentHits.length / S.intents.length : 0;
  const terrS = { delivery: s.nearby >= 5 ? 1 : s.nearby > 0 ? .92 : .85, shipping: .55, outside: 0, none: 0 }[terr.level] || 0;
  const netS = Math.min(1, (s.similar || 0) / 120);
  const parts = { cat: W.cat * catS, mk: W.mk * mkS, int: W.int * intS, terr: W.terr * terrS, net: W.net * netS };
  let score = Math.min(98, Math.round(Object.values(parts).reduce((a, b) => a + b, 0)));
  const serves = terr.level === 'delivery' || terr.level === 'shipping';
  if (!serves) score = Math.min(score, 35);

  const reasons = [];
  if (catHit.length >= 4) reasons.push(`Strong category overlap: ${catHit.length} of your ${p.categories.length} categories`);
  else if (catHit.length) reasons.push(`Carries ${listText(catHit)}`);
  if (terr.level === 'delivery') reasons.push(s.nearby > 0 ? `Already delivers to ${plural(s.nearby, 'store')} near ${p.city}` : `Delivers to ${STATE_NAMES[p.st]} (${terr.days})`);
  if (terr.level === 'shipping') reasons.push(`Ships to your ZIP ${p.zip} (${terr.eta})`);
  const bHits = intentHits.filter(i => i.kind === 'brand').map(i => i.label);
  if (bHits.length) reasons.push(`Carries ${listText(bHits)}, ${bHits.length > 1 ? 'brands' : 'a brand'} you asked about`);
  intentHits.filter(i => i.kind === 'product').forEach(i => reasons.push(`Lists ${i.label.toLowerCase()} in its catalog`));
  if (mkHit.length) reasons.push(`Focuses on ${listText(mkHit.slice(0, 3))} products`);
  if (s.similar >= 10) reasons.push(`Supplies ${s.similar} stores similar to yours on B2Bees`);
  return { score, parts, W, catHit, mkHit, intentHits, terr, serves, reasons };
}

/* Stylized Northeast map (simplified outlines, not a basemap) */
const proj = ([lon, lat]) => [(lon + 80.5) * 70, (45.1 - lat) * 90];
function mapSVG({ hi = [], pins = [], sel = null, vb = '300 170 442 325', label = 'Map of suppliers in the Northeast' } = {}) {
  const path = pts => 'M' + pts.map(p => proj(p).map(v => v.toFixed(1)).join(',')).join('L') + 'Z';
  const home = S.profile;
  let out = `<svg class="map" viewBox="${vb}" role="img" aria-label="${esc(label)}">`;

    out += `<path class="st ${home && st === home.st ? 'home' : hi.includes(st) ? 'hi' : ''}" d="${path(pts)}"/>`;
  }
  for (const [st, ll] of Object.entries(STATE_LABELS)) { const [x, y] = proj(ll); out += `<text class="stl" x="${x}" y="${y}" text-anchor="middle">${STATE_NAMES[st] || st}</text>`; }
  const seen = {};
  pins.forEach(p => {
    const n = seen[p.city] = (seen[p.city] || 0) + 1;
    let [x, y] = proj(CITY[p.city] || [-73, 41]);
    if (n > 1) { const a = n * 2.1; x += Math.cos(a) * 5 * Math.ceil(n / 3); y += Math.sin(a) * 5 * Math.ceil(n / 3); }
    out += `<g class="pin ${p.cls} ${sel === p.id ? 'sel' : ''}" data-act="pin" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.title)}"><title>${esc(p.title)}</title><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5"/></g>`;
  });
  if (home) {
    const [x, y] = proj([home.lon || -72.48, home.lat || 41.83]);
    out += `<circle class="reach" cx="${x}" cy="${y}" r="26"/><g class="home-pin"><path d="M${x} ${y} l-6 -11 a7 7 0 1 1 12 0 z"/></g><text class="home-l" x="${x + 9}" y="${y - 12}">${esc(home.name)}</text>`;
  }
  return out + '</svg>';
}

    const hay = `${p.name} ${p.addr} ${p.city} ${p.st} ${p.zip} ${p.kind}`.toLowerCase();
    return { p, n: toks.filter(t => hay.includes(t)).length };
  }).filter(x => x.n > 0).sort((a, b) => b.n - a.n).map(x => x.p);
}
function hiText(text, q) {

  q.toLowerCase().split(/[\s,]+/).filter(t => t.length > 1).forEach(t => {
    out = out.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
  });
  return out;
}

function combSVG() {
  const pts = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 180 * (60 * i - 30); return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(' ');
  const cells = [[56, 28], [84, 28], [112, 28], [42, 52], [70, 52], [98, 52], [126, 52], [56, 76], [84, 76], [112, 76]];
  return `<svg class="comb" viewBox="20 6 128 94" aria-hidden="true">${cells.map(([x, y], i) => `<polygon data-i="${i}" points="${pts(x, y, 15)}"/>`).join('')}</svg>`;
}
function runProcessing(done) {
  const steps = [...document.querySelectorAll('#psteps .pstep')];
  const polys = [...document.querySelectorAll('.comb polygon')];
  const order = [4, 5, 1, 8, 3, 6, 0, 2, 7, 9];
  let i = 0;
  const tick = () => {
    steps.forEach((el, k) => { el.className = 'pstep ' + (k < i ? 'done' : k === i ? 'now' : ''); });
    const pct = Math.round(i / steps.length * 100);
    const bar = $('#pbar'); bar && (bar.style.width = pct + '%');
    order.slice(0, Math.ceil((i + 1) / steps.length * order.length)).forEach((o, k, arr) => { polys[o] && polys[o].setAttribute('class', k === arr.length - 1 ? 'hot' : 'lit'); });
    if (i >= steps.length) { later(done, 380); return; }
    i++; later(tick, 620);
  };
  tick();
}

/* 5 — Optional product / brand intent */
function resolveIntent(q) {
  const t = q.trim().toLowerCase();
  if (!t) return { brands: [], products: [], categories: [] };
  const words = t.split(/\s+/);
  const brands = BRANDS.filter(b => { const bl = b.toLowerCase(); return bl.startsWith(t) || words.some(w => w.length > 2 && bl.replace(/'s$/, '').startsWith(w)); }).slice(0, 4);
  const products = PTYPES.filter(p => p.name.toLowerCase().includes(t) || words.some(w => w.length > 2 && (p.name.toLowerCase().includes(w) || p.kw.some(k => k.includes(w)) || (p.syn || []).some(k => k.includes(w))))).slice(0, 5);
  const categories = CATEGORIES.filter(c => c.toLowerCase().includes(t) || words.some(w => w.length > 2 && c.toLowerCase().includes(w)));
  products.forEach(p => { if (!categories.includes(p.cat)) categories.push(p.cat); });
  return { brands, products: products.map(p => p.name), categories: categories.slice(0, 4) };
}
function intentChipsHTML() {
  if (!S.intents.length) return '';
  const K = { brand: 'Brand', product: 'Product', category: 'Category', keyword: 'Search term' };
  return S.intents.map((i, k) => `<span class="chip on nocheck"><span class="faint" style="font-weight:500">${K[i.kind]}</span> ${esc(i.label)}<button class="x" data-act="removeIntent" data-i="${k}" aria-label="Remove ${esc(i.label)}">&times;</button></span>`).join('');
}
function intentFooterHTML() {
  return S.intents.length
    ? `<button class="btn btn-primary btn-lg" data-act="intentContinue">Continue with ${plural(S.intents.length, 'item')}</button><button class="btn btn-ghost" data-act="intentSkip">Skip — show me suppliers</button>`
    : `<button class="btn btn-primary btn-lg" data-act="intentSkip">Skip — show me suppliers</button><span class="faint">You can add these any time later.</span>`;
}

}

  return list;
}

const CATKW = { frozen: 'Frozen Foods', rice: 'Rice & Flour', flour: 'Rice & Flour', atta: 'Rice & Flour', snack: 'Snacks', beverage: 'Beverages', drink: 'Beverages', produce: 'Produce', vegetable: 'Produce', halal: 'Halal Meat', meat: 'Halal Meat', sweet: 'Sweets', spice: 'Spices', masala: 'Spices', packaging: 'Restaurant Packaging', dairy: 'Dairy', 'prepared': 'Prepared Food', grocer: 'Grocery' };
const MKKW = { 'south asian': 'South Asian', indian: 'Indian', pakistani: 'Pakistani', 'middle eastern': 'Middle Eastern', mediterranean: 'Mediterranean', caribbean: 'Caribbean', latin: 'Latin American', 'east asian': 'East Asian', bangladeshi: 'Bangladeshi' };
const STKW = { connecticut: 'CT', ' ct': 'CT', 'new jersey': 'NJ', ' nj': 'NJ', 'new york': 'NY', ' ny': 'NY', massachusetts: 'MA', ' ma': 'MA', 'rhode island': 'RI', pennsylvania: 'PA' };
function parseQuery(q) {
  const t = ' ' + q.toLowerCase() + ' ';
  const out = { cats: [], markets: [], brands: [], serveSt: null, hq: [], rest: '' };
  Object.entries(CATKW).forEach(([k, v]) => { if (t.includes(k) && !out.cats.includes(v)) out.cats.push(v); });
  Object.entries(MKKW).forEach(([k, v]) => { if (t.includes(k) && !out.markets.includes(v)) out.markets.push(v); });
  BRANDS.forEach(b => { if (t.includes(' ' + b.toLowerCase().replace(/'s$/, ''))) out.brands.push(b); });
  const firstState = tail => { let best = null, bi = 1e9; for (const [k, v] of Object.entries(STKW)) { const key = k.trim().length === 2 ? ' ' + k.trim() + ' ' : k; const i = tail.indexOf(key); if (i >= 0 && i < bi) { bi = i; best = v; } } return best; };
  const m = t.match(/(deliver|deliveries|delivering|ship|ships|shipping|serve|serves|serving)\w*\s+(to|in|into)\s+([a-z ]+)/);
  if (m) out.serveSt = firstState(' ' + m[3] + ' ');
  if (/near me|my store|my location|my area/.test(t) && S.profile) out.serveSt = S.profile.st;
  const hqm = t.match(/(based in|from|headquartered in)\s+([a-z ]+)/);
  if (hqm) { const st = firstState(' ' + hqm[2] + ' '); if (st) out.hq.push(st); }
  if (!out.cats.length && !out.markets.length && !out.brands.length && !out.serveSt && !out.hq.length) out.rest = q.trim();
  return out;
}
function exploreList() {
  const E = S.explore, p = S.profile;
  let list = SUPPLIERS.map(s => ({ s, f: fit(s) }));
  if (p && E.serves) list = list.filter(x => x.f.serves && ((E.delivery && x.f.terr.level === 'delivery') || (E.shipping && x.f.terr.level === 'shipping')));
  if (E.otherState) list = list.filter(x => x.s.serves[E.otherState]);
  if (E.hq.length) list = list.filter(x => E.hq.includes(stOf(x.s)));
  if (E.cats.length) list = list.filter(x => x.s.cats.some(c => E.cats.includes(c)));
  if (E.markets.length) list = list.filter(x => x.s.markets.some(m => E.markets.includes(m)));
  if (E.brands.length) list = list.filter(x => x.s.brands.some(b => E.brands.includes(b)));
  if (p && E.minFit) list = list.filter(x => x.f.score >= E.minFit);
  if (E.parsed && E.parsed.rest) { const r = E.parsed.rest.toLowerCase(); list = list.filter(x => (x.s.name + ' ' + x.s.about + ' ' + x.s.brands.join(' ') + ' ' + x.s.cats.join(' ')).toLowerCase().includes(r)); }
  return list.sort((a, b) => p ? b.f.score - a.f.score : a.s.name.localeCompare(b.s.name));
}

/* 14 — Product & brand discovery */
function productSearch(q) {
  const t = q.trim().toLowerCase();
  if (!t) return null;
  const words = t.split(/\s+/);
  const brand = BRANDS.find(b => words.includes(b.toLowerCase()) || words.includes(b.toLowerCase().replace(/'s$/, '')) || t.includes(b.toLowerCase()));
  const pt = PTYPES.find(p => p.kw.some(k => t.includes(k)) || (p.syn || []).some(k => t.includes(k)) || t.includes(p.name.toLowerCase()));
  const cat = pt ? pt.cat : CATEGORIES.find(c => words.some(w => w.length > 3 && c.toLowerCase().includes(w)));
  let prods = PRODUCTS.slice();
  if (brand) prods = prods.filter(p => p.brand === brand);
  if (pt) prods = prods.filter(p => pt.kw.some(k => p.name.toLowerCase().includes(k)));
  if (!brand && !pt) prods = cat ? prods.filter(p => p.cat === cat) : prods.filter(p => p.name.toLowerCase().includes(t));
  return { brand, pt, cat, prods };
}

function composeSheet(s, kind) {
  const title = { catalog: 'Request catalog', connect: 'Connect with supplier', pricing: 'Request pricing' }[kind];
  return `<div class="sheet-head"><div><span class="eyebrow">${esc(s.name)}</span><b class="h2" style="display:block">${title}</b></div><button class="x-btn" data-act="closeSheet" aria-label="Close">&times;</button></div>
    <div class="field"><label for="msg">Message <span class="faint">(optional)</span></label><textarea class="input" id="msg" rows="4">${esc(defaultMessage(s, kind))}</textarea></div>
    <p class="faint">${esc(s.name)} sees your store profile with this request. ${esc(s.reply)}.</p>
    <div class="actions"><button class="btn btn-primary" data-act="sendCompose" data-id="${s.id}" data-kind="${kind}">Send request</button><button class="btn btn-ghost" data-act="closeSheet">Cancel</button></div>`;
}
function sendRequest(id, kind) {
  const r = S.requests[id] = S.requests[id] || {};
  r[kind] = true;
  const ev = { catalog: 'catalog_request_sent', connect: 'supplier_connection_requested', pricing: 'pricing_request_sent' }[kind];
  track(ev, { supplier_id: id, fit: fit(supById(id)).score, seconds_since_landing: Math.round((Date.now() - S.t0) / 1000) });
}
function completeSubmit(o) {
  S.orderStatus[o.id] = 'Submitted';
  track('order_submitted', { order_id: o.id, supplier_id: o.sup, total: +orderTotal(o).toFixed(2) });
  closeSheet(); S.ordersTab = 'Submitted'; toast(`Order sent to ${supById(o.sup).name}`); rerender();
}
function saveClaimDraft() {
  const g = id => ($('#' + id) || {}).value;
  S.claimDraft = { ...(S.claimDraft || { role: 'Owner' }), name: g('c-name') ?? '', email: g('c-email') ?? '', mobile: g('c-mobile') ?? '' };
}
function submitLanding() {
  const v = ($('#q-landing') || {}).value || S.query;
  S.query = v.trim();
  if (!S.query) { toast('Enter your store name to start'); $('#q-landing') && $('#q-landing').focus(); return; }
  S.bizState = 'idle'; go('search');
}
function applyExploreQuery() {
  const E = S.explore, pr = parseQuery(E.q);
  E.parsed = E.q.trim() ? pr : null;
  E.cats = pr.cats; E.markets = pr.markets; E.brands = pr.brands; E.hq = pr.hq;

  if (pr.serveSt) { if (S.profile && pr.serveSt === S.profile.st) E.serves = true; else { E.serves = false; E.otherState = pr.serveSt; } }
  track('explore_search_submitted', { query: E.q, parsed: { cats: pr.cats, markets: pr.markets, brands: pr.brands, serves: pr.serveSt, hq: pr.hq } });
}

  search: { area: 'Business discovery', caps: ['Business Search', 'Place Data', 'Business Enrichment (lookup)'], data: ['In: free-text query', 'Out: candidate places (name, address, place type, external place ID)', 'Error state: type "error" in the search box'], q: ['Licensing and storage terms for third-party place data (can we persist place IDs and attributes?)', 'De-duplicate against retailer records that already exist on the supplier side of B2Bees.', 'Claimed vs. unclaimed store records: what if someone already claimed this store?'] },
  manual: { area: 'Business discovery', caps: ['Address normalization', 'Geocoding', 'Fallback classification'], data: ['In: name, street, city, state, ZIP', 'Out: low-confidence profile with broad categories'], q: ['Should manual stores go through a verification queue before suppliers see them?'] },
  understanding: { area: 'Business intelligence', caps: ['Business Classification', 'Category Inference', 'Market-Focus Classification', 'Confidence Scoring'], data: ['In: place type, website text, public review snippets, public photo labels, existing B2Bees data', 'Out: business type, market focus[], categories[], confidence per field, human-readable signals[]'], q: ['Latency budget: the animation covers ~3 s. Real enrichment may need async + cache.', 'Never infer owner ethnicity. Market focus is about merchandise and shoppers only.'] },
  profile: { area: 'Business intelligence', caps: ['Category Inference', 'Market-Focus Classification', 'Confidence Scoring', 'Explainability (signals)'], data: ['Low confidence → broader labels (e.g. "International Grocery").', 'Signals shown to the retailer are the evidence behind the inference.'], q: ['Confidence thresholds for narrowing vs. broadening labels.', 'Retain raw signals for audit? For how long?'], live: () => S.profile ? `Confidence (internal): type ${S.profile.conf.type.toFixed(2)} · markets ${S.profile.conf.markets.toFixed(2)} · categories ${S.profile.conf.categories.toFixed(2)}` : '' },
  edit: { area: 'Business intelligence', caps: ['Shared taxonomy (business types, markets, categories)', 'Correction feedback loop'], data: ['Out: retailer-confirmed profile; corrections are labelled training/eval data for classification.'], q: ['One taxonomy shared with the supplier catalog side, or a mapping layer between them?'] },
  interests: { area: 'Product intent', caps: ['Brand Resolution', 'Product Resolution', 'Category Mapping', 'Free-text fallback'], data: ['In: free text ("frozen paratha", "atta", "Deep")', 'Out: typed intents {brand|product|category|keyword}', 'Synonyms: parotta → paratha, chakki/flour → atta, mutton → goat'], q: ['Where do brand and product canonical lists come from? Likely bootstrapped from supplier catalog extraction.', 'Spelling variants and transliteration (Haldiram vs Haldirams).'] },
  sourcing: { area: 'Supplier matching', caps: ['Service Territory model', 'HQ vs. coverage separation'], data: ['Territory per supplier: state → delivery (days) | shipping (ETA), optional county/ZIP limits', 'Retailer preference filters by supplier HQ state, never overrides "serves me"'], q: ['Granularity of territory: state, county, ZIP, or drawn polygons?', 'Who maintains territory data: supplier-entered (Supplier Growth "Territory" step) or inferred from deliveries?'] },
  matching: { area: 'Supplier matching', caps: ['Supplier Catalog Index', 'Service Territory Matching', 'Product/Brand Matching', 'Fit Scoring'], data: ['Matching runs on: retailer profile + intents + sourcing preference.'], q: ['Precompute matches on profile change, or compute on request?'] },
  results: { area: 'Supplier matching', caps: ['Fit Scoring (explainable)', 'Faceted filters', 'Map rendering'], data: ['Fit = category overlap + market focus + intent hits + territory + network signals. Each part maps to a reason string.', 'Suppliers that cannot serve the retailer are excluded and the count is disclosed.', 'Turn Notes on to see the per-card breakdown.'], q: ['Should a high fit ever be shown without a territory match? (Prototype: no, capped at 35.)', 'Sponsored placement: if ever introduced, must be labelled and kept out of Fit.'] },
  supplier: { area: 'Supplier profile', caps: ['Supplier profile', 'Public catalog preview', 'Visibility rules (anonymous vs. registered vs. connected)', 'Promotions'], data: ['Anonymous: categories, brands, sample products, coverage, offer titles', 'Hidden until connected: prices, promo terms, contact details'], q: ['Which catalog fields can a supplier mark private?', 'Rate-limit anonymous catalog browsing to prevent scraping.'] },
  claim: { area: 'Account', caps: ['Retailer account', 'Store claim (place → account)', 'Pending-action resume'], data: ['Collects only name, work email, mobile, role.', 'Store data is carried over from the profile, never re-entered.', 'The pending action (supplier + request type) survives registration.'], q: ['Duplicate claims and disputes: two people claiming one store.', 'Personal email domains: allow, but flag for supplier trust?'] },
  verify: { area: 'Account', caps: ['Identity verification (SMS/email one-time code)'], data: ['Mock: any 6 digits pass; 000000 shows the error.'], q: ['Is SMS verification enough for suppliers to trust a store claim, or do some suppliers need business verification (resale certificate, EIN)?'] },
  ready: { area: 'Network', caps: ['Catalog Requests', 'Connections', 'Pricing requests', 'Supplier notifications'], data: ['PRIMARY ACTIVATION EVENT: catalog_request_sent or supplier_connection_requested.', 'Request payload: store profile snapshot, message, requester role.'], q: ['Supplier-side SLA and reminders when a request goes unanswered.', 'Does a catalog request auto-create a pending connection?'] },
  home: { area: 'Retention', caps: ['Home feed aggregation', 'Change detection (new suppliers, brands, offers)', 'Progressive profiling triggers'], data: ['Counts are per-retailer and should be cheap to compute (cache daily).'], q: ['Which notifications go to email/SMS vs. stay in-app?'] },
  mysuppliers: { area: 'Network', caps: ['Connection states (requested, pending, connected, declined)'], data: ['Per supplier: request history and status.'], q: ['Do declined requests show to the retailer, and how?'] },
  explore: { area: 'Discovery', caps: ['Natural-language query → filters', 'Faceted supplier search', 'Map'], data: ['Parsing is shown back to the user ("We read this as …") so mistakes are visible and correctable.'], q: ['Parsing approach must degrade gracefully to keyword search.', 'Anonymous explore: allowed, but without Fit (no store yet).'] },
  products: { area: 'Discovery', caps: ['Product/brand index across supplier catalogs', 'Product normalization (same item across catalogs)', 'Brand pages'], data: ['Product → suppliers carrying it → which of them serve the retailer → offers.'], q: ['Normalizing pack sizes and names across supplier catalogs is the hard part.', 'Do we show price ranges once a retailer is connected to several suppliers?'] },
  offers: { area: 'Retention', caps: ['Promotions', 'Relevance by category + territory'], data: ['Only offers from suppliers that serve the retailer, in categories the retailer buys.'], q: ['Supplier-authored vs. extracted from uploaded flyers?'] },
  orders: { area: 'Transactions', caps: ['Simple order status', 'Progressive profiling at first order'], data: ['First submit asks for receiving details; resale certificate only when that supplier requires it.', 'Statuses: New → Submitted → Accepted → In Delivery → Completed.'], q: ['Is B2Bees the system of record for orders, or a relay to supplier systems?', 'Out of scope for now: payments, credit, invoicing.'] },
  weekly: { area: 'Retention', caps: ['Weekly digest generation', 'Change detection', 'Email + in-app rendering'], data: ['Inputs: new suppliers serving the retailer\'s area, new products in followed categories, offers, catalog updates.'], q: ['Minimum content threshold so a thin week doesn\'t send a weak email.'] },
  buying: { area: 'Profile', caps: ['Retailer interest profile'], data: ['Same model as onboarding: categories, markets, followed brands/products, sourcing preference.'], q: [] }
};
function renderNotes() {
  const n = NOTES[S.route] || {};
  const live = n.live ? n.live() : '';
  const scr = SCREENS.find(x => x[1] === S.route || x[1].startsWith(S.route + '-'));
  $('#notes').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="eyebrow" style="color:var(--progress)">Prototype notes</span><button class="x-btn" data-act="toggleNotes" aria-label="Close notes">&times;</button></div>
    <div class="n-sec"><span class="eyebrow">${scr ? 'Screen ' + scr[0] : 'Screen'} · ${esc(n.area || '')}</span><h3>${esc(scr ? scr[2] : S.route)}</h3></div>
    ${n.caps ? `<div class="n-sec"><span class="eyebrow">Potential capabilities</span><div class="caps">${n.caps.map(c => `<span>${esc(c)}</span>`).join('')}</div></div>` : ''}
    ${n.data ? `<div class="n-sec"><span class="eyebrow">Data</span><ul class="bul">${n.data.map(c => `<li>${esc(c)}</li>`).join('')}${live ? `<li><b>${esc(live)}</b></li>` : ''}</ul></div>` : ''}
    ${n.q && n.q.length ? `<div class="n-sec"><span class="eyebrow">Open questions</span><ul class="bul">${n.q.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
    <div class="n-sec"><span class="eyebrow">Activation timing (this session)</span><div class="kpi"><span>Time to first supplier match</span><b>${fmtT(S.tFirstMatch)}</b><span>Time to first catalog request / connection</span><b>${fmtT(S.tFirstAction)}</b></div></div>
    <div class="n-sec"><span class="eyebrow">Analytics events (live)</span><div>${S.log.length ? S.log.slice(0, 14).map(e => `<div class="ev"><span>${fmtT(e.t)}</span><div>${esc(e.ev)}${Object.keys(e.props).length ? `<br><span>${esc(JSON.stringify(e.props))}</span>` : ''}</div></div>`).join('') : '<span class="faint">No events yet.</span>'}</div></div>
    <div class="n-sec"><span class="eyebrow">Sample data</span><div class="seg"><button class="${S.week6 ? '' : 'on'}" data-act="setWeek" data-v="1">Day 1</button><button class="${S.week6 ? 'on' : ''}" data-act="setWeek" data-v="6">Week 6</button></div><span class="faint">Week 6 adds connected suppliers and orders.</span></div>
    <div class="n-sec"><span class="eyebrow">Jump to screen</span><div class="jump">${SCREENS.map(([k, r, l]) => `<button class="${r === S.route || r.startsWith(S.route + '-') ? 'on' : ''}" data-act="jump" data-r="${r}"><i>${k}</i>${esc(l)}</button>`).join('')}</div>
      <span class="faint">Jumping fills in Spice Town and a demo account where a screen needs them.</span></div>
    <div class="n-sec"><button class="btn btn-secondary btn-sm" data-act="restart">Restart prototype</button></div>`;
}

/* ================================================================ BOOT */
document.addEventListener('click', e => {
  const dd = e.target.closest('details.nav-dd');
  document.querySelectorAll('details.nav-dd[open]').forEach(x => { if (x !== dd) x.open = false; });
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); const r = g.dataset.go; if (dd) dd.open = false; go(r); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { e.preventDefault(); ACT[a.dataset.act]({ ...a.dataset }, a, e); }
  if (e.target.id === 'sheet') closeSheet();
  const sug = $('#intent-suggest');
  if (sug && !e.target.closest('#intent-suggest') && e.target.id !== 'q-intent') sug.hidden = true;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); document.querySelectorAll('details.nav-dd[open]').forEach(x => x.open = false); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g.pin')) { e.preventDefault(); ACT.pin({ id: e.target.dataset.id }); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (f && FORMS[f.dataset.form]) { e.preventDefault(); FORMS[f.dataset.form](); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el); });
window.addEventListener('hashchange', render);
render();
</script>
</body></html>
